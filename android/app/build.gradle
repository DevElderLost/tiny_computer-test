plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.example.tiny_computer"
    compileSdk 35
    ndkVersion "27.0.12077973"  // flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.java.srcDirs += 'src/main/java'
        // libwayland-server.so + libffi.so (prebuilt dari DroidDeck), dipisah dari jniLibs
        // supaya jniLibs.zip dari rilis tiny_container tidak menimpanya.
        main.jniLibs.srcDirs += 'src/main/wayland-jniLibs'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.fct.tiny"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk 28 // glob() version //proot version //ffmpeg_kit; flutter.minSdkVersion
        targetSdk 28 //https://github.com/termux/termux-app/issues/1072; native; linker; flutter.targetSdkVersion
        versionCode 20260205
        versionName "1.1.0-compose"

        buildConfigField "String", "COMMIT", "\"" + ("git rev-parse HEAD\n".execute().getText().trim() ?: (System.getenv('CURRENT_COMMIT') ?: "NO_COMMIT")) + "\""

        // adrenotools (loader Turnip) hanya mendukung arm64-v8a.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

    }
    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
        aidl true
        dataBinding true
        viewBinding true
        buildConfig true
    }
    

    lint {
        disable "NullSafeMutableLiveData"
    }

    lintOptions {
        //checkReleaseBuilds false
        abortOnError false
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libffi.so'
        pickFirst 'lib/arm64-v8a/libwayland-server.so'
        pickFirst 'lib/arm64-v8a/libtermux.so'
        // proot, busybox, dsb. dieksekusi dari nativeLibraryDir -> harus diekstrak.
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // UI: seluruhnya Jetpack Compose (sama seperti DroidDeck).
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // Terminal: Termux terminal-view menggantikan xterm + flutter_pty (PTY native).
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
    // Driver Turnip (bionic, lewat adrenotools) dikirim sebagai .tzst di assets.
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    // dekompresi .wcp berformat xz (commons-compress hanya membungkus library ini)
    implementation 'org.tukaani:xz:1.10'

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.7.0"
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    // Ikon .svg di menu Shortcut (sama seperti DroidDeck).
    implementation 'com.caverock:androidsvg-aar:1.4'
}
